name: Production chat evaluation

on:
  push:
    tags: ['chat-eval-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-chat-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check deployed revision and evaluate synthetic conversations
        run: node scripts/quality/evaluate-production.cjs --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-production-chat-evaluation
          path: _workspace/quality/production-evaluation.json
          retention-days: 7
          if-no-files-found: ignore
